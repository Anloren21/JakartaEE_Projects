<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Amazonia | Tienda Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="css/index.css" rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link rel="icon" href="fotos/cart.svg">
<script type="module" src="js/index.js"></script>
</head>
<body class="h-100 d-flex flex-column">
	<nav class="navbar navbar-expand-lg bg-dark sticky-top"
		data-bs-theme="dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">Amazonia | JS</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link"
						href="#">Principal</a></li>
				</ul>
				<form id="buscar-texto" class="d-flex" role="search">
					<input name="texto" class="form-control me-2" type="search"
						placeholder="Buscar" aria-label="Search" value="" />
					<button class="btn btn-outline-success" type="submit">Buscar</button>
				</form>
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active" href="carrito"><i
							class="bi bi-cart"></i>&nbsp;CARRITO</a></li>

					<li class="nav-item administrador"><a class="nav-link active"
						href="admin/listado">Administración</a></li>
					<li class="nav-item autenticado"><a class="nav-link"
						href="usuario"><i class="bi bi-person-fill"></i>&nbsp;
							${usuario.nombre}&nbsp;${usuario.rol}</a></li>
					<li class="nav-item autenticado"><a class="nav-link"
						href="logout"><i class="bi bi-box-arrow-right"></i></a></li>

					<li class="nav-item"><a class="nav-link" href="login"><i
							class="bi bi-box-arrow-in-right"></i></a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div id="alerta" class="alert alert-info alert-dismissible fade show"
		role="alert">
		${alerta.mensaje}
		<button type="button" class="btn-close" data-bs-dismiss="alert"
			aria-label="Close"></button>
	</div>
	<main class='container my-5'>
		<section id="listado">
			<div class="row row-cols-1 row-cols-md-3 g-4"></div>

			<nav class="mt-3" aria-label="Page navigation">
				<ul class="pagination justify-content-center">
					<!-- Ir al Inicio-->
					<li id="p-inicio" class="page-item"><a class="page-link"
						href="#" aria-label="Previous"> <i
							class="bi bi-chevron-bar-left"></i>
					</a></li>

					<!-- Anterior -->
					<li id="p-anterior" class="page-item"><a class="page-link"
						href="#" aria-label="Anterior"> <i class="bi bi-chevron-left"></i>
					</a></li>

					<li id="p-numero" class="page-item active"><a
						class="page-link" href="#"></a></li>

					<!-- Siguiente -->
					<li id="p-siguiente" class="page-item"><a class="page-link"
						href="#" aria-label="Next"> <i class="bi bi-chevron-right"></i>
					</a></li>

					<!-- Ir al final-->
					<li id="p-fin" class="page-item"><a class="page-link" href="#"
						aria-label="Último"> <i class="bi bi-chevron-bar-right"></i>
					</a></li>
				</ul>
			</nav>
		</section>
		
		<section id="detalle">
			<div class="card mb-3">
				<div class="row g-0">
					<div class="col-md-4">
						<img src=""
							class="img-fluid rounded-start" alt="...">
					</div>
					<div class="col-md-8">
						<div class="card-body">
							<h5 class="card-title"></h5>
							<p class="card-text"></p>
							<p class="card-text">
								<small class="text-body-secondary"> </small>
							</p>

							<form class="d-flex" action="carrito/anadir">
								<input type="hidden" name="id" value="">
								<button class="me-3 btn btn-primary" type="submit">Añadir
									a carrito</button>

								<span class="input-group" style="width: auto">
									<button id="menos" class="btn btn-outline-secondary"
										type="button">
										<i class="bi bi-dash"></i>
									</button> <input id="cantidad" name="cantidad" type="text" pattern="\d+"
									class="form-control text-center" style="max-width: 3rem"
									value="1">
									<button id="mas" class="btn btn-outline-secondary"
										type="button">
										<i class="bi bi-plus-lg"></i>
									</button>
								</span>
							</form>

						</div>
					</div>
				</div>
			</div>

		</section>
	</main>

	<footer class="p-2 text-bg-dark mt-auto"> &copy;2026
		RjhuLorraine </footer>

	<script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
